# Campus Harmony ERP — Continuous Integration
#
# Before this, NOTHING enforced quality: 58 type errors and 53 dependency
# vulnerabilities could ship, and no test ran on any change.
#
# Gate order is deliberate — cheapest and most likely to fail first, so
# feedback arrives in seconds rather than minutes.

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  # Cancel superseded runs on the same branch — no point testing stale commits.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ── Gate 1: types ───────────────────────────────────────────────────────────
  # Backend is at 0 errors. Keep it there.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Prisma client must exist before the backend can typecheck.
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
        env:
          MONGODB_URI: mongodb://placeholder:placeholder@localhost:27017/placeholder

      - name: Typecheck backend
        working-directory: backend
        run: npx tsc --noEmit

      # Now BLOCKING. It was non-blocking while ~22 known errors were
      # outstanding; those are cleared and the project sits at zero.
      #
      # Note the explicit `-p tsconfig.app.json`. The root tsconfig.json holds
      # `"files": []` and only project references, so a bare `tsc --noEmit`
      # compiles NOTHING and exits 0 no matter what is broken — and `vite build`
      # transpiles with esbuild without typechecking either. A bare invocation
      # here would be a gate that can never fail. `npm run typecheck` wraps the
      # correct command.
      - name: Typecheck frontend
        run: npm run typecheck

  # ── Gate 2: tests ───────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
        env:
          MONGODB_URI: mongodb://placeholder:placeholder@localhost:27017/placeholder

      # Includes the source-level guards that fail if data fabrication, the
      # hardcoded JWT secret, or unscoped tenant models are reintroduced.
      - name: Run backend tests
        working-directory: backend
        run: npm test

  # ── Gate 3: schema and seed ─────────────────────────────────────────────────
  # MongoDB has no migration history to replay, so this gate checks the schema
  # itself, then — when a database is available — that the indexes apply and the
  # seed still runs against it.
  #
  # The live steps need a REPLICA SET (the services use transactions), so they
  # run against a dedicated Atlas database supplied as the CI_MONGODB_URI
  # repository secret. Without the secret they are skipped rather than failing:
  # forks and first-time contributors have no access to it.
  schema:
    name: Schema validation
    runs-on: ubuntu-latest

    env:
      MONGODB_URI: ${{ secrets.CI_MONGODB_URI || 'mongodb://placeholder:placeholder@localhost:27017/placeholder' }}
      HAS_DATABASE: ${{ secrets.CI_MONGODB_URI != '' }}
      NODE_ENV: test
      JWT_SECRET: ci-only-secret-value-at-least-32-characters-long
      ALLOW_SEED: 'yes'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate the Prisma schema
        working-directory: backend
        run: npx prisma validate

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Apply indexes to the CI database
        if: env.HAS_DATABASE == 'true'
        working-directory: backend
        run: npx prisma db push --skip-generate

      - name: Seed (proves the seed still runs against the schema)
        if: env.HAS_DATABASE == 'true'
        working-directory: backend
        run: npx prisma db seed

      # Proves publishing results actually moves a student's CGPA.
      #
      # This runs here rather than in the unit-test job because the defect it
      # guards was in the WIRING between correct parts — the GPA arithmetic
      # passed its unit tests the whole time StudentProfile.cgpa sat at 0 for
      # a student with 92 credits. Only a real database, driven through the
      # real services, exercises the connection.
      - name: Verify results publication recomputes CGPA
        if: env.HAS_DATABASE == 'true'
        working-directory: backend
        run: npm run verify:results

  # ── Gate 4: security ────────────────────────────────────────────────────────
  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # The 53 vulnerabilities that justified a critical-only gate are down to
      # 5 backend / 4 frontend, none critical, after `npm audit fix` (the
      # non-forcing form — only semver-compatible upgrades, with typecheck,
      # tests and build verified after). What remains needs major-version bumps
      # (`--force`), which is a deliberate upgrade, not a CI action.
      #
      # Still blocking on critical rather than high: tightening to `high` today
      # would fail the build on transitive advisories nobody can act on without
      # that breaking upgrade, and a permanently red gate is a gate people learn
      # to ignore. Raise this to `high` with the upgrade, not before it.
      - name: Audit backend (blocks on critical)
        working-directory: backend
        run: npm audit --audit-level=critical

      - name: Audit frontend (blocks on critical)
        run: npm audit --audit-level=critical

      # Guards against the legacy JWT fallback being reintroduced. It is in git
      # history, so it must never reappear as working code.
      #
      # NOTE: three files legitimately reference the string —
      #   config/env.ts        rejects it explicitly, and documents why
      #   __tests__/security.test.ts   asserts it is absent
      # A naive `grep -r "supersecretkey123"` matches all of those and fails on
      # the very code that prevents the problem. This checks the auth path only,
      # for the actual fallback-assignment pattern.
      #
      # `npm test` is the authoritative check — it strips comments before
      # asserting, so it cannot be fooled by documentation either way.
      - name: Assert no hardcoded secret fallback in the auth path
        run: |
          # Comment lines are stripped first: config/env.ts documents the old
          # pattern in prose, and matching that would fail on the documentation
          # explaining the fix — pressuring a maintainer to delete it.
          FOUND=$(cat backend/src/middleware/auth.ts \
                      backend/src/routes/auth.ts \
                      backend/src/config/env.ts \
                  | sed -E 's://.*::' \
                  | grep -vE '^\s*\*' \
                  | grep -E "process\.env\.JWT_SECRET\s*\|\|" || true)
          if [ -n "$FOUND" ]; then
            echo "::error::JWT_SECRET fallback reintroduced — the secret must have no default."
            echo "$FOUND"
            exit 1
          fi
          echo "No JWT_SECRET fallback in the auth path."

  # ── Gate 5: container image ─────────────────────────────────────────────────
  # The Dockerfile was authored on a machine without Docker, so it has never
  # been built locally. This job is its first real verification — treat a
  # failure here as expected-and-informative, not surprising.
  docker:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: campus-harmony-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prove the image boots and fails CLOSED without JWT_SECRET — the
      # fail-fast behaviour is a security property and should be tested, not
      # assumed.
      - name: Assert the container refuses to start without JWT_SECRET
        run: |
          set +e
          OUTPUT=$(docker run --rm \
            -e MONGODB_URI=mongodb://u:p@localhost:27017/db \
            campus-harmony-backend:ci 2>&1)
          CODE=$?
          set -e
          echo "$OUTPUT"
          if [ $CODE -eq 0 ]; then
            echo "::error::Container started without JWT_SECRET — fail-fast is broken."
            exit 1
          fi
          echo "$OUTPUT" | grep -q "JWT_SECRET is required" \
            && echo "Container correctly refused to start." \
            || { echo "::error::Exited, but not for the expected reason."; exit 1; }

  # ── Gate 6: frontend build ──────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: /api

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7
