# Render Blueprint — one-click provisioning for Campus Harmony ERP.
#
# Deploys two services from this single repo. The database is MongoDB Atlas,
# which Render does not provision — set MONGODB_URI in the dashboard.
#   1. campus-harmony-backend  — the Express API (backend/Dockerfile), with a
#      persistent disk mounted over /app/uploads so uploaded files survive a
#      redeploy. This is a single-instance deployment: the disk is NOT shared
#      across replicas. Horizontal scaling needs STORAGE_PROVIDER=s3 (see
#      backend/src/lib/storage.ts) before adding a second instance.
#   2. campus-harmony-frontend — the Vite/React SPA as a static site.
#
# To deploy: push this file to the repo's default branch, then in the Render
# dashboard choose "New +" -> "Blueprint" and point it at the repo. Render
# reads this file and creates both services together.
#
# JWT_SECRET is generated by Render itself (generateValue: true) — nobody
# needs to invent or paste a secret. MONGODB_URI is `sync: false`: paste the
# Atlas connection string (including the database name) in the dashboard, and
# allow Render's outbound IPs in the Atlas network access list.
#
# CORS_ORIGINS and VITE_API_BASE_URL are NOT cross-wired via `fromService`.
# Render's blueprint `fromService` only exposes a service's PRIVATE-network
# address (host / port / hostport) — confirmed against Render's own Blueprint
# spec docs — never its public https:// URL. Using it here would have set
# CORS_ORIGINS to a hostname the browser cannot send as an Origin header, and
# VITE_API_BASE_URL to an address the browser cannot resolve at all: both
# services would "deploy" successfully and both would be unreachable.
#
# Instead these two are literal `https://<service-name>.onrender.com` values,
# which is Render's default public subdomain for a service with this name.
# CAVEAT: that subdomain is global across all Render accounts. If either name
# is already taken, Render appends a random suffix on first deploy — check
# the actual URL Render assigns for both services (Render dashboard -> each
# service -> the URL under its name), and if either differs from the guess
# below, update the matching envVar here (or in the dashboard) to the real
# URL and redeploy. VITE_API_BASE_URL is baked in at BUILD time for a static
# site, so that side needs a rebuild, not just a restart, to pick up a change.

services:
  - type: web
    name: campus-harmony-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/ready
    disk:
      name: campus-harmony-uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: BCRYPT_ROUNDS
        value: 10
      - key: PASSWORD_MIN_LENGTH
        value: 12
      - key: LOGIN_RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: LOGIN_RATE_LIMIT_MAX
        value: 5
      - key: API_RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: API_RATE_LIMIT_MAX
        value: 300
      - key: CORS_ORIGINS
        value: https://campus-harmony-frontend.onrender.com
      - key: UPLOAD_MAX_FILE_SIZE_BYTES
        value: 26214400
      - key: UPLOAD_DIR
        value: uploads
      - key: LOG_LEVEL
        value: info
      - key: STORAGE_PROVIDER
        value: local
      - key: BACKUP_DIR
        value: backups
      - key: BACKUP_RETENTION_DAYS
        value: 30
      - key: NOTIFICATION_DRIVER
        value: live
      - key: NOTIFICATION_FROM_EMAIL
        value: noreply@campus-harmony-backend.onrender.com
      - key: NOTIFICATION_FROM_NAME
        value: Campus Harmony ERP
      # The six below have no working default — each is a real external
      # account only you can create (see the render.yaml comment block and
      # backend/.env.example for what each one activates). `sync: false`
      # means Render leaves them blank rather than inventing a placeholder;
      # set the real values in the Render dashboard once you have them.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: 0.1
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: campus-harmony-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://campus-harmony-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
