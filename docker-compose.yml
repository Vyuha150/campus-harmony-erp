# Campus Harmony ERP — local / staging stack
#
#   docker compose up -d
#   docker compose exec backend npx prisma db push      # create indexes
#   docker compose exec backend npm run backup:verify   # restore drill
#
# This is a REPRODUCIBLE deployment. Previously there was none: no Dockerfile,
# no compose file, no defined backend host, and three conflicting port
# assumptions across server.ts, ecosystem.config.cjs and the CORS config.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      # MongoDB Atlas (or any replica set). There is no database container: the
      # data lives in the managed cluster. Must include the database name.
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI must be set, e.g. mongodb+srv://USER:PASSWORD@HOST/campus_harmony}
      # No default. The server REFUSES TO START without it, and rejects the
      # legacy hardcoded value. Generate with:
      #   node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set — there is no default}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # mongodump/mongorestore are on PATH in the runtime image.
      MONGO_BIN_DIR: ''
      BACKUP_DIR: /app/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    ports:
      - '${BACKEND_PORT:-5000}:5000'
    volumes:
      # Named volumes so uploads and backups survive a container replacement.
      # NOTE: these are still node-local. Multi-instance deployment requires
      # object storage for uploads (A5) and off-host backup replication.
      - uploads:/app/uploads
      - backups:/app/backups

volumes:
  uploads:
  backups:
