# Campus Harmony ERP on its own subdomain: frontend and API on one origin.
# Replace the domain if it changes, copy to /etc/nginx/sites-available/campus-harmony-erp,
# symlink into sites-enabled, `nginx -t && systemctl reload nginx`, then
# `certbot --nginx -d campus-erp.ivyuha.in` adds HTTPS and the http→https redirect.

server {
    listen 80;
    listen [::]:80;
    server_name campus-erp.ivyuha.in;

    root /var/www/campus-harmony-erp/dist;
    index index.html;

    # Uploads (certificates, evidence) go through the API, 25 MB max.
    client_max_body_size 26m;

    location /api/ {
        proxy_pass http://127.0.0.1:8726;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Built assets have hashed names: cache them hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other path is a client-side route.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
